# Ingestion API: POST /v1/telemetry/* (events, hook-events, artifacts, transcripts) and the OTLP
# receiver under /v1/otel, all with a bearer JWT (RS256, verified against ouroboros-jwks; audience,
# issuer, scope Telemetry.Write and oid/upn claims required). Applies the schema migrations on
# start and stamps the caller's identity onto every stored record.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ouroboros-api
  namespace: ouroboros
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ouroboros-api
  template:
    metadata:
      labels:
        app: ouroboros-api
    spec:
      imagePullSecrets:
        - name: acr-pull   # externalsecret-acr.yaml
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001   # "ouroboros" in the image
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: example.azurecr.io/ouroboros/api   # registry + tag patched per environment
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AUTH_MODE
              value: dev
            - name: JWT_AUDIENCE
              value: api://ouroboros-telemetry
            - name: JWT_ISSUER
              value: https://ouroboros.local/dev-issuer
            - name: JWKS_PATH
              value: /etc/ouroboros/jwks/jwks.json
            - name: FRESHNESS_WINDOW_SECONDS
              value: "300"
            # Connection string generated by CloudNativePG for the ouroboros-db cluster's app user.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ouroboros-db-app
                  key: uri
          volumeMounts:
            - name: jwks
              mountPath: /etc/ouroboros/jwks
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: jwks
          configMap:
            name: ouroboros-jwks
---
apiVersion: v1
kind: Service
metadata:
  name: ouroboros-api
  namespace: ouroboros
spec:
  selector:
    app: ouroboros-api
  ports:
    - name: http
      port: 80
      targetPort: http

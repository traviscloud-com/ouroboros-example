# Ouroboros' database: a CloudNativePG-managed PostgreSQL 17 cluster in the app's namespace. The
# operator creates the database and owner on first start and writes the app credentials to the
# Secret ouroboros-db-app (keys uri, username, password, dbname, host, port); both services read
# DATABASE_URL from it, so no database password exists outside the cluster. The ingestion API
# applies the schema (api/migrations/, idempotent) on start. One instance on the local cluster;
# environments raise instances/storage and add backups in their overlay.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ouroboros-db
  namespace: ouroboros
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: ouroboros
      owner: ouroboros
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: 64MB
---
# Only the two services may open connections; the operator (cnpg-system) reaches the instance
# manager.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ouroboros-db
  namespace: ouroboros
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: ouroboros-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ouroboros-api
        - podSelector:
            matchLabels:
              app: ouroboros-reporting
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: ouroboros-db

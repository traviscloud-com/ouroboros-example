# The only way in is the Gateway: admit the Envoy proxy pods of the platform Gateway and nothing
# else inside the cluster. Kubelet probes are node traffic and not subject to NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ouroboros
  namespace: ouroboros
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [ouroboros-api, ouroboros-reporting]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
      ports:
        - protocol: TCP
          port: 8000

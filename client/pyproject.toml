[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ouroboros-client"
version = "0.2.0"
description = "Ouroboros skill telemetry client SDK and Claude Code hook capture"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.17",
]
dev = [
    "pytest>=8.0",
    "PyJWT[crypto]>=2.8",
]

[project.scripts]
ouroboros-hook = "ouroboros_client.hook:main"
ouroboros-report = "ouroboros_client.report:main"
ouroboros-sync-artifacts = "ouroboros_client.sync_artifacts:main"

[tool.hatch.build.targets.wheel]
packages = ["ouroboros_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
